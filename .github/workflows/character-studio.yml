name: Character workflow checks
on:
  pull_request:
    paths:
      - 'characters/**'
      - 'backend/character_studio.py'
      - 'backend/storage_api.py'
      - 'backend/generation_controls.py'
      - '*character*.js'
      - '*character*.cjs'
      - 'ai-assistant.js'
      - 'generation-studio.js'
      - '.github/workflows/character-studio.yml'
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r backend/requirements-youtube.txt Pillow
      - run: npm install --prefix /tmp/ecco-test-deps jsdom@26.1.0 --no-audit --no-fund
      - name: Character, authorization and cancellation tests
        run: PYTHONPATH=backend python -m unittest test_character_studio test_storage_api test_generation_controls test_generation_cancel characters.test_worker
      - name: Character UI, entry, handoff and cancellation tests
        run: NODE_PATH=/tmp/ecco-test-deps/node_modules node --test character-studio.test.cjs character-handoff.test.cjs ai-generation-instructions.test.cjs tests/generation-stop.test.cjs
      - run: python scripts/ui_inventory.py --check
