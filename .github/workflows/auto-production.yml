name: Automatic production release
run-name: Automatic production release ${{ github.event.workflow_run.head_sha }}
# Owner decision (8 November 2026): every main-branch build that passes Release
# checks is published to production automatically. Set the repository variable
# ECCO_AUTO_PRODUCTION to 'false' to pause; Ecco Desk Releases still handles rollbacks.
on:
  workflow_run:
    workflows: [Release checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ecco-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && vars.ECCO_AUTO_PRODUCTION != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://ecco-ai-labs.github.io/ecco-studio/
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish the tested build
        working-directory: scripts
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CHECK_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: python3 auto_release.py
