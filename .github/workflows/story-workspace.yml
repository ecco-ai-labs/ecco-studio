name: Story workspace checks
on:
  pull_request:
    paths:
      - '*.js'
      - '*.cjs'
      - '*.html'
      - 'updates/**'
      - 'tests/**'
      - '.github/workflows/story-workspace.yml'
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/ecco-story-tests jsdom@26.1.0 fake-indexeddb@6.2.4 --no-audit --no-fund
      - run: NODE_PATH=/tmp/ecco-story-tests/node_modules node --test *.test.cjs tests/popup-controls.test.cjs tests/navigation-history.test.cjs tests/studio-workspace-tabs.test.cjs tests/model-selection.test.cjs tests/generation-stop.test.cjs tests/publishing-status.test.cjs tests/publishing-library.test.cjs
      - run: python3 scripts/ui_inventory.py --check
