name: Audio flow verification checks
on:
  pull_request:
    paths:
      - 'audio-flow-verification*'
      - 'audio-studio.js'
      - 'audio-direction.js'
      - 'audio-emotion-binding.test.cjs'
      - 'audio-task-progress*'
      - 'audio-sound-generation.js'
      - 'backend/audio_jobs.py'
      - 'backend/test_audio_jobs.py'
      - 'audio-studio.css'
      - 'generation-stop.js'
      - 'ai-text-refinement.js'
      - 'ai-assistant.js'
      - 'audio-review-script.js'
      - 'audio-workflow.js'
      - 'audio/preflight_resources.py'
      - 'backend/audio_preflight.py'
      - 'backend/test_audio_preflight.py'
      - 'backend/storage_api.py'
      - 'storage-client.js'
      - '.github/workflows/audio-verification.yml'
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r backend/requirements-youtube.txt
      - run: npm install --prefix /tmp/ecco-test-deps jsdom@26.1.0 --no-audit --no-fund
      - run: PYTHONPATH=backend python -m unittest test_audio_preflight test_audio_jobs test_storage_api
      - run: NODE_PATH=/tmp/ecco-test-deps/node_modules node --test audio-emotion-binding.test.cjs audio-task-progress.test.cjs audio-flow-verification.test.cjs audio-worker-availability.test.cjs tests/generation-stop.test.cjs
      - run: NODE_PATH=/tmp/ecco-test-deps/node_modules node --test ai-assistant.test.cjs ai-generation-instructions.test.cjs audio-storytelling.test.cjs audio-automatic-sounds.test.cjs audio-mixed-voices.test.cjs
      - run: python scripts/ui_inventory.py --check
