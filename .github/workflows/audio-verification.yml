name: Audio flow verification checks
on:
  pull_request:
    paths:
      - 'audio-flow-verification*'
      - 'audio-studio.js'
      - 'audio/preflight_resources.py'
      - 'backend/audio_preflight.py'
      - 'backend/test_audio_preflight.py'
      - 'backend/storage_api.py'
      - 'storage-client.js'
      - '.github/workflows/audio-verification.yml'
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r backend/requirements-youtube.txt
      - run: npm install --prefix /tmp/ecco-test-deps jsdom@26.1.0 --no-audit --no-fund
      - run: PYTHONPATH=backend python -m unittest test_audio_preflight test_storage_api
      - run: NODE_PATH=/tmp/ecco-test-deps/node_modules node --test audio-flow-verification.test.cjs audio-worker-availability.test.cjs
      - run: python scripts/ui_inventory.py --check
